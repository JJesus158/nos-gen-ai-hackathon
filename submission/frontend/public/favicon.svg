<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5529c3"/>
      <stop offset="0.55" stop-color="#7048e8"/>
      <stop offset="1" stop-color="#8257ff"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <!-- The veil: a soft translucent fold over the lower part of the tile. -->
    <path d="M0 45 C 14 37, 30 53, 64 41 V 64 H 0 Z" fill="#bea8ff" fill-opacity="0.24"/>
  </g>
  <!-- The asterisk that DataVeil puts in place of every masked word. -->
  <g stroke="#ffffff" stroke-width="8.5" stroke-linecap="round">
    <line x1="32" y1="14.5" x2="32" y2="49.5"/>
    <line x1="16.84" y1="23.25" x2="47.16" y2="40.75"/>
    <line x1="16.84" y1="40.75" x2="47.16" y2="23.25"/>
  </g>
</svg>
