<a class="skip-link" href="#main-content">{{ language.text().skip }}</a>
<header class="site-header">
  <nav class="navbar container" [attr.aria-label]="language.text().navigation">
    <a class="brand" routerLink="/" aria-label="DataVeil">
      <span>Data<span class="brand-accent">Veil</span></span>
    </a>
    <div class="header-preferences">
      <div class="theme-control">
        <button
          type="button"
          class="theme-toggle"
          [class.is-dark]="theme.preference() === 'dark'"
          [attr.aria-label]="language.text().appearance"
          [attr.aria-pressed]="theme.preference() === 'dark'"
          (click)="toggleTheme()"
        >
          <span class="theme-toggle-icon sun-icon" aria-hidden="true">
            <svg
              width="14"
              height="14"
              [attr.viewBox]="'0 0 ' + themeIcons.light.icon[0] + ' ' + themeIcons.light.icon[1]"
              fill="currentColor"
              focusable="false"
            >
              <path [attr.d]="themeIcons.light.icon[4]" />
            </svg>
          </span>
          <span class="theme-toggle-icon moon-icon" aria-hidden="true">
            <svg
              width="14"
              height="14"
              [attr.viewBox]="'0 0 ' + themeIcons.dark.icon[0] + ' ' + themeIcons.dark.icon[1]"
              fill="currentColor"
              focusable="false"
            >
              <path [attr.d]="themeIcons.dark.icon[4]" />
            </svg>
          </span>
          <span class="theme-toggle-thumb" aria-hidden="true"></span>
        </button>
      </div>
      <div class="language-control">
        <button
          type="button"
          class="language-select"
          [attr.aria-label]="language.text().language"
          [attr.aria-expanded]="languageMenuOpen()"
          aria-haspopup="listbox"
          (click)="toggleLanguageMenu()"
        >
          <img
            class="language-flag"
            [src]="language.preference() === 'en' ? 'flags/gb.svg' : 'flags/pt.svg'"
            alt=""
          />
          <span>{{
            language.preference() === 'en' ? language.text().english : language.text().portuguese
          }}</span>
          <span class="language-chevron" aria-hidden="true">⌄</span>
        </button>
        @if (languageMenuOpen()) {
          <div class="language-menu" role="listbox" [attr.aria-label]="language.text().language">
            <button
              type="button"
              role="option"
              class="language-option"
              [class.is-selected]="language.preference() === 'en'"
              [attr.aria-selected]="language.preference() === 'en'"
              (click)="setLanguage('en')"
            >
              <img class="language-flag" src="flags/gb.svg" alt="" />
              <span>{{ language.text().english }}</span>
            </button>
            <button
              type="button"
              role="option"
              class="language-option"
              [class.is-selected]="language.preference() === 'pt-PT'"
              [attr.aria-selected]="language.preference() === 'pt-PT'"
              (click)="setLanguage('pt-PT')"
            >
              <img class="language-flag" src="flags/pt.svg" alt="" />
              <span>{{ language.text().portuguese }}</span>
            </button>
          </div>
        }
      </div>
    </div>
  </nav>
</header>
<main id="main-content" class="container" tabindex="-1">
  <router-outlet />
</main>
<footer class="site-footer">
  <div class="footer-content container">
    <p>© 2026 · {{ language.text().authors }}</p>
    <p>{{ apiEnabled ? language.text().apiFooterNote : language.text().footerNote }}</p>
  </div>
</footer>
