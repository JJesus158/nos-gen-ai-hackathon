@if (documents.result(); as result) {
  <div class="workspace-page">
    <section class="page-heading">
      <h1 id="results-title" tabindex="-1">{{ language.text().resultsTitle }}</h1>
      <p>{{ language.text().resultsDescription }}</p>
    </section>
    <app-document-progress />
    <div
      class="document-workspace comparison"
      role="region"
      aria-labelledby="results-title"
      tabindex="0"
    >
      <section class="panel preview-panel">
        <div class="panel-heading">
          <h2 id="original-title">{{ language.text().original }}</h2>
          <span class="preview-file-name">{{ documents.file()?.name }}</span>
        </div>
        <div class="paper-scroll" role="region" aria-labelledby="original-title" tabindex="0">
          <app-pdf-preview
            [file]="documents.file()!"
            [fullSize]="true"
            [showControls]="false"
          />
        </div>
      </section>
      <section class="panel preview-panel protected-panel">
        <div class="panel-heading">
          <h2 id="anonymized-title">{{ language.text().anonymized }}</h2>
          <span class="preview-file-name">{{ result.download.name }}</span>
        </div>
        <div class="paper-scroll" role="region" aria-labelledby="anonymized-title" tabindex="0">
          <div
            class="pdf-result-preview"
            [attr.aria-label]="language.text().firstPagePreview"
          >
            <app-pdf-preview
              [file]="maskMode() === 'blur' ? (blurredPreviewPdf() ?? result.download.blob) : result.download.blob"
              [fullSize]="true"
              [showControls]="false"
              [maskMode]="maskMode() === 'blur' ? 'blur' : 'highlight'"
              [highlights]="maskMode() === 'blur' ? result.entities : []"
              [sourceText]="result.originalText"
            />
          </div>
        </div>
        <div class="mask-controls" role="group" [attr.aria-label]="language.text().maskMode">
          <span class="mask-label">{{ language.text().maskMode }}</span>
          <button
            type="button"
            class="mask-option"
            [class.is-selected]="maskMode() === 'blur'"
            [attr.aria-pressed]="maskMode() === 'blur'"
            (click)="maskMode.set('blur')"
          >{{ language.text().blur }}</button>
          <button
            type="button"
            class="mask-option"
            [class.is-selected]="maskMode() === 'asterisk'"
            [attr.aria-pressed]="maskMode() === 'asterisk'"
            (click)="maskMode.set('asterisk')"
          >{{ language.text().asterisks }}</button>
        </div>
      </section>
    </div>
    <div class="page-actions">
      <div class="page-action-group">
        <button type="button" class="btn btn-outline-secondary" (click)="backToReview()">
        <svg
          width="12"
          height="12"
          [attr.viewBox]="'0 0 ' + backIcon.icon[0] + ' ' + backIcon.icon[1]"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path [attr.d]="backIcon.icon[4]" />
        </svg>
          {{ language.text().back }}</button>
      </div>
      <div class="page-action-group">
        <button type="button" class="btn btn-outline-secondary" (click)="restart.emit()">
          {{ language.text().chooseAnother }}
        </button>
        <button type="button" class="btn btn-primary" (click)="download()">
          {{ language.text().download }}
          <svg
            width="12"
            height="12"
            [attr.viewBox]="'0 0 ' + downloadIcon.icon[0] + ' ' + downloadIcon.icon[1]"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path [attr.d]="downloadIcon.icon[4]" />
          </svg>
        </button>
      </div>
    </div>
  </div>
}
