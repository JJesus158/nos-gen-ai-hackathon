<div #pages class="pdf-pages" [hidden]="!rendered() || state() === 'unavailable'"></div>
@if (state() === 'unavailable' || !rendered()) {
  <div class="preview-fallback" role="status">
    <svg
      width="25"
      height="30"
      [attr.viewBox]="'0 0 ' + icon.icon[0] + ' ' + icon.icon[1]"
      fill="currentColor"
      aria-hidden="true"
      focusable="false"
    >
      <path [attr.d]="icon.icon[4]" />
    </svg>
    <span>{{
      state() === 'loading' ? language.text().previewLoading : language.text().previewUnavailable
    }}</span>
  </div>
}
@if (fullSize() && showControls()) {
  <div class="pdf-controls" role="toolbar" aria-label="PDF zoom controls">
    <button type="button" (click)="zoomOut()" [disabled]="zoom() <= 0.5" aria-label="Zoom out">−</button>
    <button type="button" (click)="resetZoom()" aria-label="Reset zoom">{{ (zoom() * 100).toFixed(0) }}%</button>
    <button type="button" (click)="zoomIn()" [disabled]="zoom() >= 2.5" aria-label="Zoom in">+</button>
    <button type="button" (click)="zoom.set(1)" aria-label="Fit PDF to width">↔</button>
    <button type="button" (click)="zoom.set(0.5)" aria-label="Fit PDF to height">↕</button>
  </div>
}
